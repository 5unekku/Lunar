[unstable]
# enables codegen-backend in profile tables (nightly only)
codegen-backend = true

[alias]
# Build API docs without embedded source HTML.
doc-no-source = "doc --workspace --no-deps"
# Run the build/dist/run task runner. e.g. `cargo xtask run`
xtask = "run --package xtask --"

[env]
# Requires nightly; used by `cargo doc` and the alias above.
RUSTDOCFLAGS = "-Zunstable-options --html-no-source"

# wasm SIMD: lets glam (and LLVM autovectorization) use 128-bit vector ops.
# every WebGPU-capable browser supports simd128, so this costs no compatibility.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# export all symbols from the host binary so dlopen'd C# NativeAOT plugins can
# find lunar_ffi functions via NativeLibrary.GetMainProgramHandle().
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-args=-Wl,-export-dynamic"]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-args=-Wl,-export_dynamic"]
