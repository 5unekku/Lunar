cargo-features = ["codegen-backend"]

# codegen-backend profile keys below are nightly-only

[workspace]
members = [
		"crates/lunar-core",
		"crates/lunar-2d",
		"crates/lunar-3d",
		"crates/lunar-render",
		"crates/lunar-render-3d",
		"crates/lunar-input",
		"crates/lunar-math",
		"crates/lunar",
		"crates/lunar-macros",
		"crates/lunar-assets",
		"crates/lunar-image",
		"crates/lunar-atlas",
		"crates/lunar-bsp",
		"crates/lunar-bsp-build",
		"crates/lunar-lightmap",
		"crates/lunar-gamedata",
		"crates/lunar-gamedata-build",
		"crates/lunar-audio",
		"bindings/c",
		"crates/lunar-plugin-loader",
		"crates/lunar-plugin-loader/fixture",
	"crates/lunar-dotnet-host",
		"xtask",
		"tests/api_seal",
	"tools/navmesh-bench",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MPL-2.0"
description = "a game engine for Rust with ECS, wgpu rendering, and WASM support"
repository = "https://gitlab.com/5unekku/Lunar"
homepage = "https://gitlab.com/5unekku/Lunar"
readme = "README.md"
keywords = ["game-engine", "gamedev", "ecs", "wgpu", "2d"]
categories = ["game-engines", "graphics", "wasm"]

[workspace.dependencies]
bevy_ecs = { version = "0.18", features = ["multi_threaded"] }
glam = "0.33"
wgpu = { version = "29.0.3", default-features = false }
raw-window-handle = "0.6"
sdl3 = { version = "0.18", features = ["build-from-source-static"] }
log = "0.4"
# default-features off drops the `regex` feature (pulls regex/aho-corasick,
# ~580 KiB of .text) used only for regex log-filter patterns. RUST_LOG
# module+level filtering still works; color + humantime timestamps kept.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
pollster = "0.4"
bytemuck = "1"
rayon    = "1"
rustc-hash = "2"
libloading = "0.8"

[package]
name = "lunar-game"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["coreclr"]
debug   = ["bevy_ecs/debug"]
# CoreCLR hosting for proper hot reload; default for dev. release builds
# disable it via --no-default-features and use NativeAOT instead.
coreclr = ["lunar-plugin-loader/coreclr"]

[[bin]]
name = "lunar"
path = "src/main.rs"

[[bin]]
name = "lunar-web"
path = "src/web.rs"

[[example]]
name = "headless_probe"
path = "examples/headless_probe/main.rs"

[[example]]
name = "platform_demo"
path = "examples/platform_demo/main.rs"

[[example]]
name = "shooter_example"
path = "examples/shooter_example/main.rs"

[[example]]
name = "platform_demo_cs"
path = "examples/platform_demo_cs/main.rs"

[dev-dependencies]
lunar-ffi = { path = "bindings/c" }
# used by the headless_probe example to build a wgpu instance for off-screen rendering.
wgpu = { workspace = true }

# plugin-loader is libloading-based and cannot compile on bare wasm. it is only
# used by the platform_demo_cs example (C# scripting, which does not run on wasm
# anyway), so gate it off wasm. this lets the pure-rust examples build for wasm
# via run_wasm.go without dragging in a native-only dev-dep.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lunar-plugin-loader = { path = "crates/lunar-plugin-loader" }

[dependencies]
# `lunar` is the only dependency a real game needs. enable optional modules
# via feature flags.
lunar = { path = "crates/lunar", package = "lunar-engine", features = ["3d"] }

bevy_ecs = { workspace = true }
log = { workspace = true }

# web entry point only
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d"] }

# ── build profiles ────────────────────────────────────────────────────────────
# principle 1: small, fast binaries that run well on low-spec machines.
# these apply workspace-wide (cargo reads profiles only from the root manifest).

[profile.release]
opt-level     = 3        # maximum speed
lto           = "fat"    # whole-program LTO: cross-crate inlining + dead code elimination
codegen-units = 1        # single codegen unit: best optimisation, slowest compile
panic         = "abort"  # no unwind tables: smaller binary, no overhead
strip         = "symbols"  # strip debug symbols, keep minimal export table

# size-first variant of release: same lto/panic/strip, opt-level swapped to size.
# opt-in only (cargo build --profile release-min); the default release stays
# opt-level 3 for max runtime speed. opt-level z can cost runtime speed, so this
# is the developer's explicit size-over-speed choice, never the default.
[profile.release-min]
inherits  = "release"
opt-level = "z"

# faster debug iteration: cranelift skips LLVM's expensive passes for workspace
# crates so incremental rebuilds are near-instant. external deps keep LLVM at -O3
# so the hot path (wgpu, bevy_ecs, zstd) still runs fast at dev time.
[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
opt-level       = 3
codegen-backend = "llvm"

# lunar-3d's SoA cull uses explicit avx2 intrinsics (llvm.x86.avx.cmp.ps.256)
# that cranelift does not implement yet (rustc_codegen_cranelift issue 171), so
# it must use llvm even in dev or its tests SIGABRT. targeted override, the rest
# of the workspace keeps cranelift for fast iteration.
[profile.dev.package.lunar-3d]
codegen-backend = "llvm"
