[package]
name = "lunar-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "audio system: AudioSource trait, mixer, symphonia decoding, sdl3 native + emscripten-sidecar backends"

[dependencies]
lunar-core   = { path = "../lunar-core",   version = "1.0.0" }
lunar-assets = { path = "../lunar-assets", version = "1.0.0" }
bevy_ecs     = { workspace = true }
log          = { workspace = true }
crossbeam-channel = "0.5"

# "wav" is only the riff demuxer; "pcm" is the codec that decodes the samples
# inside it (without it every .wav failed with "unsupported codec")
symphonia = { version = "0.5", default-features = false, features = [
    "ogg", "vorbis", "wav", "pcm", "flac",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl3 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
