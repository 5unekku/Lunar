[package]
name = "lunar-render-3d"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "3d wgpu renderer for lunar"
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[build-dependencies]
naga     = { version = "29.0.3", features = ["wgsl-in", "spv-out"] }
glob     = "0.3"
bytemuck = "1"

[dependencies]
rustc-hash = { workspace = true }
lunar-3d       = { path = "../lunar-3d", version = "1.0.0" }
lunar-assets   = { path = "../lunar-assets", version = "1.0.0" }
lunar-bsp      = { path = "../lunar-bsp", version = "1.0.0" }
lunar-core     = { path = "../lunar-core", version = "1.0.0" }
lunar-lightmap = { path = "../lunar-lightmap", version = "1.0.0" }
lunar-math     = { path = "../lunar-math", version = "1.0.0" }
bevy_ecs    = { workspace = true }
wgpu        = { workspace = true, features = ["wgsl"] }
log         = { workspace = true }
bytemuck    = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rayon]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# spirv: native release builds load build.rs's precompiled spirv (make_shader!);
# wasm never does, and this feature alone pulled naga into the wasm graph
wgpu     = { workspace = true, features = ["vulkan", "gles", "spirv"] }
pollster = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu      = { workspace = true, features = ["webgpu"] }
web-sys   = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element", "Performance"] }
wasm-bindgen = { version = "0.2" }
