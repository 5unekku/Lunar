language = "C"
include_guard = "LUNAR_H"
tab_width = 4
documentation = true
documentation_style = "c99"
autogen_warning = "/* generated by cbindgen, do not edit */"

[export]
include = [
    "LunarEntity",
    "LunarComponentId",
    "LunarSystemId",
    "LunarWorld",
    "LunarVec2",
    "LunarVec3",
    "LunarQuat",
    "LunarTransform3d",
    "LunarTransform2d",
    "LunarQueryFn",
    "LunarSystemFn",
    "lunar_spawn",
    "lunar_despawn",
    "lunar_alive",
    "lunar_component_register",
    "lunar_component_id",
    "lunar_component_insert",
    "lunar_component_remove",
    "lunar_component_has",
    "lunar_component_get",
    "lunar_component_get_mut",
    "lunar_get_transform3d",
    "lunar_set_transform3d",
    "lunar_get_transform2d",
    "lunar_set_transform2d",
    "lunar_query_foreach",
    "lunar_system_register",
    "lunar_system_unregister",
    "lunar_delta_seconds",
    "lunar_elapsed_seconds",
]

[parse]
parse_deps = false
