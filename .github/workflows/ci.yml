name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # opt into node 24 early — forced default on 2026-06-16
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # build deps shared by every job. libegl-dev pulls in the x11 headers, so SDL3's
  # from-source build enables its x11 backend and then hard-requires xcursor and
  # friends (configure fails with "Couldn't find dependency package for XCURSOR").
  SYS_DEPS: >-
    git ca-certificates build-essential cmake pkg-config libssl-dev clang
    libwayland-dev libxkbcommon-dev libegl-dev
    libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev
    libxtst-dev libxfixes-dev
  # the repo's actions policy only allows actions owned by 5unekku, so
  # actions/checkout and Swatinem/rust-cache are rejected at "Set up job" (every
  # run since 2026-06 died there). jobs check out with plain git instead.
  CHECKOUT: |
    git init -q .
    git config --global --add safe.directory "$PWD"
    auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
    git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
    git checkout -q FETCH_HEAD

jobs:
  clippy:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq $SYS_DEPS
      - run: eval "$CHECKOUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    steps:
      # mesa-vulkan-drivers ships lavapipe so the headless gpu tests actually
      # run here instead of skipping for lack of an adapter
      - run: apt-get update -qq && apt-get install -y -qq $SYS_DEPS mesa-vulkan-drivers libvulkan1
      - run: eval "$CHECKOUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo test --workspace

  build-wasm:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq $SYS_DEPS
      - run: eval "$CHECKOUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # lunar-game covers the full facade plus both bins (lunar is wasm-gated, lunar-web is the wasm entry).
      # llvm because [profile.dev] pins cranelift, which has no wasm32 backend
      # ("can't compile for wasm32-unknown-unknown" in lunar-math)
      - run: cargo build --target wasm32-unknown-unknown --package lunar-game --config 'profile.dev.codegen-backend="llvm"'

  smoke:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq $SYS_DEPS xvfb mesa-vulkan-drivers libvulkan1
      - run: eval "$CHECKOUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # SDL_VIDEODRIVER=x11 prevents SDL3 from trying Wayland (unavailable in container)
      - run: SDL_VIDEODRIVER=x11 WGPU_BACKEND=vulkan xvfb-run -a cargo run --example platform_demo -- --smoke

  build-cross:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    env:
      # every crate except the sdl3-dependent ones (lunar, lunar-render,
      # lunar-input, lunar-audio): sdl3 is target-independent rust, verified
      # by the x86_64/aarch64 full builds instead of every cross target here.
      ENGINE_CRATES: >-
        -p lunar-math -p lunar-core -p lunar-2d -p lunar-3d -p lunar-bsp
        -p lunar-gamedata -p lunar-atlas -p lunar-lightmap -p lunar-render-3d
        -p lunar-image -p lunar-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # full workspace where sdl3 cross-builds; engine set elsewhere:
          # i686/armv7 hit the sdl3 0.18.4 XlibWindowHandle u64-vs-u32 bug on 32-bit,
          # windows needs a MinGW windres for SDL3's resource script
          - { target: x86_64-unknown-linux-gnu, full: true }
          - { target: aarch64-unknown-linux-gnu, full: true }
          - { target: armv7-unknown-linux-gnueabihf, full: false }
          - { target: i686-unknown-linux-gnu, full: false }
          - { target: x86_64-pc-windows-gnu, full: false }
          - { target: i686-pc-windows-gnu, full: false }
          - { target: aarch64-pc-windows-gnullvm, full: false }
    steps:
      - run: apt-get update -qq && apt-get install -y -qq $SYS_DEPS python3-pip
      - run: eval "$CHECKOUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: rustup target add ${{ matrix.target }}
      - run: pip install cargo-zigbuild --break-system-packages
      - run: |
          if [ "${{ matrix.full }}" = "true" ]; then scope="--workspace"; else scope="$ENGINE_CRATES"; fi
          # force llvm here: [profile.dev] pins cranelift for fast local debug
          # iteration, but cranelift can't target 32-bit (armv7/i686) at all, and
          # CI cross-builds are throughput, not interactive debugging, so they
          # want the real shipping backend regardless of target.
          cargo zigbuild --target ${{ matrix.target }} $scope --config 'profile.dev.codegen-backend="llvm"'
